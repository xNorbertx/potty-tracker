plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('key.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace = "com.xnorbertx.pottytracker"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.xnorbertx.pottytracker"
        minSdk = 23
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                keyAlias = signingProperties['keyAlias']
                keyPassword = signingProperties['keyPassword']
                storeFile = rootProject.file(signingProperties['storeFile'])
                storePassword = signingProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

// Never silently publish a release using a temporary debug certificate.
gradle.taskGraph.whenReady { graph ->
    if (!signingPropertiesFile.exists() && graph.allTasks.any {
        it.project == project && it.name.toLowerCase().contains('release')
    }) {
        throw new GradleException('Release signing requires android/key.properties. See README.md.')
    }
}

flutter {
    source = "../.."
}

name: Android APK checks and releases

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Set version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          test -n "$base"
          echo "name=$base" >> "$GITHUB_OUTPUT"
          echo "code=$((100000 + RUN_NUMBER))" >> "$GITHUB_OUTPUT"
      - name: Configure PR build with example settings and temporary signing key
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: |
          cp lib/firebase_options.dart.example lib/firebase_options.dart
          cp android/app/google-services.json.example android/app/google-services.json
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/android-release.p12" -alias potty-tracker \
            -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=CI build check' \
            -storepass ci-test-only -keypass ci-test-only
          printf 'storeFile=%s\nstorePassword=ci-test-only\nkeyPassword=ci-test-only\nkeyAlias=potty-tracker\n' \
            "$RUNNER_TEMP/android-release.p12" > android/key.properties
      - name: Configure signed production build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set +x
          for value in FIREBASE_OPTIONS_DART GOOGLE_SERVICES_JSON KEYSTORE_BASE64 SIGNING_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "::error::Missing required secret: $value"
              exit 1
            fi
          done
          umask 077
          printf '%s\n' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.p12"
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=potty-tracker\n' \
            "$RUNNER_TEMP/android-release.p12" "$SIGNING_PASSWORD" "$SIGNING_PASSWORD" > android/key.properties
      - name: Test
        run: flutter test
      - name: Build signed release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: flutter build apk --release --build-name "$VERSION_NAME" --build-number "$VERSION_CODE"
      - name: Verify APK signature, version and manifest
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-manifest.txt"
          grep -F "package: name='com.xnorbertx.pottytracker' versionCode='$VERSION_CODE'" "$RUNNER_TEMP/apk-manifest.txt"
          grep -F "launchable-activity: name='com.xnorbertx.potty_tracker.MainActivity'" "$RUNNER_TEMP/apk-manifest.txt"
          grep -F "uses-permission: name='android.permission.INTERNET'" "$RUNNER_TEMP/apk-manifest.txt"
      - name: Package APK and checksum
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          mkdir -p release
          filename="potty-tracker-$VERSION_NAME-build.$VERSION_CODE.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release/$filename"
          cd release
          sha256sum "$filename" > "$filename.sha256"
      - name: Upload signed APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          path: release/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.p12" android/key.properties

  publish:
    name: Publish downloadable APK
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release
          path: release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION_NAME: ${{ needs.build.outputs.version }}
          VERSION_CODE: ${{ needs.build.outputs.code }}
        run: |
          tag="android-v$VERSION_NAME-build.$VERSION_CODE"
          # Rerunning the same workflow must not replace a published binary.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping the published APK."
            exit 0
          fi
          printf 'Android %s (build %s)\n\nBuilt from commit %s.\n\nDownload the APK below and install it on Android. Installations of the old debug-signed APK must be uninstalled once before installing this release. Future builds use the same release certificate.\n\nThis app connects to the existing Firebase diary.\n' \
            "$VERSION_NAME" "$VERSION_CODE" "$COMMIT_SHA" > release-notes.md
          gh release create "$tag" release/*.apk release/*.sha256 \
            --target "$COMMIT_SHA" --title "Android $VERSION_NAME (build $VERSION_CODE)" \
            --notes-file release-notes.md --latest

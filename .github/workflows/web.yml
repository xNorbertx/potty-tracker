name: Web checks and deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Use example Firebase configuration for PR checks
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: cp lib/firebase_options.dart.example lib/firebase_options.dart
      - name: Configure production Firebase
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_DART" ]; then
            echo '::error::Repository secret FIREBASE_OPTIONS_DART is required for production builds.'
            exit 1
          fi
          printf '%s\n' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart
      - name: Test
        run: flutter test
      - name: Build release web app
        run: flutter build web --release --base-href /potty-tracker/
      - name: Record deployed revision
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: printf '%s\n' "$COMMIT_SHA" > build/web/version.txt
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/web

  deploy:
    name: Deploy web to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
